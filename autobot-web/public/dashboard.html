<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dashboard - AutoBot</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#FFFFFF",
              "background-light": "#F3F4F6",
              "background-dark": "#0A0A0A",
              "surface-dark": "#161616",
              "border-dark": "#2A2A2A",
              "accent-blue": "#3B82F6",
              "accent-purple": "#8B5CF6",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              mono: ["JetBrains Mono", "monospace"],
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              'xl': '0.75rem',
              '2xl': '1rem',
            },
          },
        },
      };
    </script>
    <style>
        .glow-box {
            box-shadow: 0 0 40px -10px rgba(139, 92, 246, 0.15);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
  </head>
  <body class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-200 antialiased font-sans transition-colors duration-300 min-h-screen flex flex-col">
    <nav class="sticky top-0 z-50 border-b border-gray-200 dark:border-white/10 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <a href="/" class="flex items-center gap-2">
            <div class="text-2xl font-bold tracking-tighter dark:text-white flex items-center gap-2">
              <span class="material-icons text-gray-800 dark:text-white">smart_toy</span>
              AutoBot
            </div>
          </a>
          <div class="flex items-center space-x-4">
            <a
              class="inline-flex items-center gap-2 text-sm font-medium text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors"
              href="https://github.com/Tej-Sharma/autobot"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Open Source on GitHub"
            >
              <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                <path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path>
              </svg>
              <span class="hidden sm:inline">Open Source</span>
            </a>
            <div class="flex items-center gap-3">
              <img id="nav-avatar" alt="user" class="h-8 w-8 rounded-full ring-1 ring-purple-400/50" src=""/>
              <span id="nav-login" class="text-sm font-medium text-gray-600 dark:text-gray-300 hidden sm:inline font-mono"></span>
            </div>
            <button id="logout-button" class="rounded-full border border-gray-300 dark:border-white/10 text-sm px-4 py-2 bg-white/80 dark:bg-surface-dark/80 hover:bg-gray-100 dark:hover:bg-white/10 transition">Sign out</button>
          </div>
        </div>
      </div>
    </nav>

    <main class="flex-grow relative overflow-hidden">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-20 pb-24 relative z-10">
        <div class="bg-white/50 dark:bg-surface-dark/60 border border-gray-200 dark:border-white/10 rounded-3xl p-8 md:p-10 glow-box">
          <div class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
              <p class="text-xs uppercase tracking-widest text-gray-500 dark:text-gray-400">Dashboard</p>
              <h2 class="text-3xl font-bold text-gray-900 dark:text-white">Connected GitHub account</h2>
              <p class="text-gray-600 dark:text-gray-400 mt-1">Enable repositories and apply Autobot webhooks so PR events trigger QA runs.</p>
            </div>
          </div>

          <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8">
            <div class="flex items-center gap-3">
              <img id="user-avatar" alt="user" class="h-12 w-12 rounded-full ring-2 ring-purple-400/70" src=""/>
              <div>
                <p id="user-name" class="font-semibold text-gray-900 dark:text-white">Loading...</p>
                <p id="user-login" class="text-sm text-gray-600 dark:text-gray-400 font-mono"></p>
              </div>
            </div>
            <button id="sync-webhooks-btn" class="rounded-full bg-black dark:bg-white text-white dark:text-black px-6 py-3 text-sm font-semibold hover:bg-gray-800 dark:hover:bg-gray-200 transition">Enable webhook on selected repos</button>
          </div>

          <div class="mt-4 mb-8 grid gap-3">
            <label for="run-base-url" class="text-sm text-gray-600 dark:text-gray-300">Run now target URL (custom environment)</label>
            <div class="flex flex-col sm:flex-row gap-3">
              <input id="run-base-url" class="flex-1 rounded-lg border border-gray-300 dark:border-white/10 bg-white/70 dark:bg-black/20 px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-purple-500/40" placeholder="https://your-app.example.com"/>
              <button id="run-default-branch-btn" class="rounded-full bg-purple-600 text-white px-5 py-2.5 text-sm font-semibold hover:bg-purple-500 transition">Run now on selected repos (default branch)</button>
            </div>
          </div>

          <div id="repo-loading" class="text-sm text-gray-500 dark:text-gray-400 mb-4">Loading repositories...</div>
          <div id="repo-empty" class="hidden text-sm text-gray-500 dark:text-gray-400 mb-4">No repositories with webhook admin access were found.</div>

          <div class="bg-background-light/70 dark:bg-black/25 rounded-2xl border border-gray-200 dark:border-white/10 p-4 md:p-5">
            <div id="repo-list" class="space-y-3 max-h-80 overflow-auto pr-2"></div>
          </div>

          <div id="sync-result" class="mt-6 text-sm rounded-xl border border-gray-200 dark:border-white/10 bg-white/50 dark:bg-black/25 p-4 hidden"></div>
        </div>
      </div>
    </main>

    <footer class="border-t border-gray-200 dark:border-white/10 bg-background-light dark:bg-background-dark py-12">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-6">
        <div class="text-sm text-gray-500 dark:text-gray-400">&copy; 2026 Constella App, Inc.</div>
        <div class="flex gap-6">
          <a class="text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors" href="https://x.com/taayjuss" target="_blank" rel="noopener noreferrer">
            <span class="sr-only">X</span>
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path d="M8.29 20.251c7.547 0 11.675-6.253 11.675-11.675 0-.178 0-.355-.012-.53A8.348 8.348 0 0022 5.92a8.19 8.19 0 01-2.357.646 4.118 4.118 0 001.804-2.27 8.224 8.224 0 01-2.605.996 4.107 4.107 0 00-6.993 3.743 11.65 11.65 0 01-8.457-4.287 4.106 4.106 0 001.27 5.477A4.072 4.072 0 012.8 9.713v.052a4.105 4.105 0 003.292 4.022 4.095 4.095 0 01-1.853.07 4.108 4.108 0 003.834 2.85A8.233 8.233 0 012 18.407a11.616 11.616 0 006.29 1.84"></path></svg>
          </a>
          <a class="text-gray-400 hover:text-gray-900 dark:hover:text-white transition-colors" href="https://github.com/Tej-Sharma/autobot" target="_blank" rel="noopener noreferrer">
            <span class="sr-only">Open Source on GitHub</span>
            <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24"><path clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" fill-rule="evenodd"></path></svg>
          </a>
        </div>
      </div>
    </footer>

    <script>
      document.documentElement.classList.add('dark');
      localStorage.setItem('theme', 'dark');

      const api = async (url, options = {}) => {
        const response = await fetch(url, {
          headers: {
            'Content-Type': 'application/json',
            ...(options.headers || {}),
          },
          ...options,
        });

        const payload = await response.json().catch(() => ({ error: 'Invalid JSON response' }));
        if (!response.ok) {
          throw new Error(payload.error || `Request failed (${response.status})`);
        }
        return payload;
      };

      const hide = (el) => el.classList.add('hidden');
      const show = (el) => el.classList.remove('hidden');

      const repoList = document.getElementById('repo-list');
      const repoLoading = document.getElementById('repo-loading');
      const repoEmpty = document.getElementById('repo-empty');
      const syncResult = document.getElementById('sync-result');
      const syncButton = document.getElementById('sync-webhooks-btn');
      const runNowButton = document.getElementById('run-default-branch-btn');
      const runBaseUrlInput = document.getElementById('run-base-url');
      const userAvatar = document.getElementById('user-avatar');
      const userName = document.getElementById('user-name');
      const userLogin = document.getElementById('user-login');
      const logoutButton = document.getElementById('logout-button');
      const navAvatar = document.getElementById('nav-avatar');
      const navLogin = document.getElementById('nav-login');

      const renderRepos = (repos) => {
        if (!repos.length) {
          repoLoading.classList.add('hidden');
          show(repoEmpty);
          return;
        }
        hide(repoLoading);
        repoEmpty.classList.add('hidden');
        repoList.innerHTML = repos
          .map(
            (repo) => `
              <label class="flex items-center justify-between gap-4 border border-gray-200 dark:border-white/10 rounded-lg px-3 py-2 bg-white/40 dark:bg-white/5">
                <span class="inline-flex items-center gap-3 min-w-0">
                  <input type="checkbox" name="repo" value="${repo.fullName}" class="h-4 w-4 rounded border-gray-300">
                  <span class="truncate">
                    <span class="font-medium text-gray-900 dark:text-white">${repo.fullName}</span>
                    <span class="block text-xs text-gray-500 dark:text-gray-400 truncate">${repo.description || 'No description'}</span>
                  </span>
                </span>
                <span class="text-xs text-gray-500 dark:text-gray-400 ${repo.private ? 'text-yellow-400' : ''}">${repo.private ? 'Private' : 'Public'}</span>
              </label>
            `,
          )
          .join('');
      };

      const loadDashboardData = async () => {
        const readSession = async () =>
          api('/api/session').catch(() => ({ authenticated: false }));

        let session = await readSession();
        if (!session.authenticated) {
          await new Promise((resolve) => setTimeout(resolve, 250));
          session = await readSession();
        }

        if (!session.authenticated) {
          window.location.href = '/';
          return;
        }

        userAvatar.src = session.user.avatarUrl;
        userName.textContent = session.user.name || 'GitHub User';
        userLogin.textContent = `@${session.user.login}`;
        navAvatar.src = session.user.avatarUrl;
        navLogin.textContent = `@${session.user.login}`;

        const repos = await api('/api/repos');
        renderRepos(repos.repositories || []);
      };

      const syncWebhooks = async () => {
        const selected = Array.from(document.querySelectorAll('input[name="repo"]:checked')).map((node) => node.value);
        if (!selected.length) {
          syncResult.textContent = 'Select at least one repository before syncing webhooks.';
          show(syncResult);
          syncResult.className = 'mt-6 text-sm rounded-xl border border-amber-300/40 bg-amber-200/20 dark:bg-amber-400/10 text-amber-300 p-4';
          return;
        }

        syncButton.disabled = true;
        syncButton.textContent = 'Syncing...';
        syncResult.className = 'mt-6 text-sm rounded-xl border border-gray-200 dark:border-white/10 bg-white/50 dark:bg-black/25 p-4';
        syncResult.textContent = 'Syncing repositories...';
        show(syncResult);

        try {
          const result = await api('/api/webhooks/sync', {
            method: 'POST',
            body: JSON.stringify({ repos: selected }),
          });

          const lines = result.results.map(
            (entry) => `${entry.repo}: ${entry.status.replaceAll('_', ' ').replace(/\b\w/g, (match) => match.toUpperCase())} - ${entry.message}`,
          );
          if (result.tokenSync && !result.tokenSync.ok) {
            const failed = Array.isArray(result.tokenSync.failed) ? result.tokenSync.failed.join(', ') : '';
            lines.push(
              `Token sync failed${failed ? ` for ${failed}` : ''}; PR commenting may use fallback token.`,
            );
          }
          syncResult.innerHTML = lines.map((line) => `<div>${line}</div>`).join('');
        } catch (error) {
          syncResult.textContent = error.message || 'Failed to sync webhooks';
        } finally {
          syncButton.disabled = false;
          syncButton.textContent = 'Enable webhook on selected repos';
        }
      };

      const runNow = async () => {
        const selected = Array.from(document.querySelectorAll('input[name="repo"]:checked')).map((node) => node.value);
        if (!selected.length) {
          syncResult.textContent = 'Select at least one repository before running.';
          show(syncResult);
          syncResult.className = 'mt-6 text-sm rounded-xl border border-amber-300/40 bg-amber-200/20 dark:bg-amber-400/10 text-amber-300 p-4';
          return;
        }

        const targetBaseUrl = runBaseUrlInput.value.trim();
        if (!targetBaseUrl) {
          syncResult.textContent = 'Enter a deployment URL before running.';
          show(syncResult);
          syncResult.className = 'mt-6 text-sm rounded-xl border border-amber-300/40 bg-amber-200/20 dark:bg-amber-400/10 text-amber-300 p-4';
          return;
        }

        runNowButton.disabled = true;
        runNowButton.textContent = 'Queuing runs...';
        syncResult.className = 'mt-6 text-sm rounded-xl border border-gray-200 dark:border-white/10 bg-white/50 dark:bg-black/25 p-4';
        syncResult.textContent = 'Running selected repos on default branch...';
        show(syncResult);

        try {
          const result = await api('/api/runs/default-branch', {
            method: 'POST',
            body: JSON.stringify({
              repos: selected,
              baseUrl: targetBaseUrl,
              mode: 'smoke',
              includeJudge: true,
            }),
          });

          const lines = result.results.map((entry) => {
            const state = entry.status.replace('_', ' ').replace(/\b\w/g, (char) => char.toUpperCase());
            const link = entry.statusUrl ? ` <a class="underline" href="${entry.statusUrl}" target="_blank">status</a>` : '';
            return `${entry.repo}: ${state} - ${entry.message}${link ? ` (${link})` : ''}`;
          });
          if (result.tokenSync && !result.tokenSync.ok) {
            const failed = Array.isArray(result.tokenSync.failed) ? result.tokenSync.failed.join(', ') : '';
            lines.push(
              `Token sync failed${failed ? ` for ${failed}` : ''}; PR comments may use fallback token.`,
            );
          }

          syncResult.innerHTML = lines.map((line) => `<div>${line}</div>`).join('');
        } catch (error) {
          syncResult.textContent = error.message || 'Failed to run now';
        } finally {
          runNowButton.disabled = false;
          runNowButton.textContent = 'Run now on selected repos (default branch)';
        }
      };

      const logout = async () => {
        await api('/api/logout', { method: 'POST' }).catch(() => {});
        window.location.href = '/';
      };

      // Auth guard + load data
      loadDashboardData().catch(() => {
        window.location.href = '/';
      });

      // Clean ?auth=success from URL
      if (new URLSearchParams(window.location.search).get('auth') === 'success') {
        window.history.replaceState({}, document.title, window.location.pathname);
      }

      syncButton?.addEventListener('click', syncWebhooks);
      runNowButton?.addEventListener('click', runNow);
      logoutButton?.addEventListener('click', logout);
    </script>
  </body>
</html>
