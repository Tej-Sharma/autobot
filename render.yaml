services:
  - type: web
    name: autobot
    runtime: docker
    region: oregon
    plan: starter
    branch: development
    autoDeploy: true
    dockerContext: .
    dockerfilePath: autobot/Dockerfile
    dockerCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: APP_BASE_URL
        value: https://autobot.it.com
      - key: ARTIFACT_ROOT
        value: /app/artifacts
      - key: REDIS_URL
        fromService:
          name: autobot-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: APP_BASE_URL
        value: https://autobot.it.com
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_ALLOWED_REPOS
        sync: false
      - key: AUTOBOT_WEBHOOK_URL
        value: https://autobot-er1m.onrender.com/api/github/webhook
      - key: AUTOBOT_API_TOKEN
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_PROJECT_ID
        sync: false

  - type: worker
    name: autobot-worker
    runtime: docker
    region: oregon
    plan: starter
    autoDeploy: true
    dockerContext: .
    dockerfilePath: autobot/Dockerfile
    dockerCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          name: autobot-redis
          type: redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GITHUB_ALLOWED_REPOS
        sync: false
      - key: AUTOBOT_API_TOKEN
        sync: false
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_PROJECT_ID
        sync: false

  - type: web
    name: autobot-web
    runtime: docker
    region: oregon
    branch: development
    plan: starter
    autoDeploy: true
    dockerContext: .
    dockerfilePath: autobot-web/Dockerfile
    dockerCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4173
      - key: AUTOBOT_API_BASE_URL
        value: https://autobot-er1m.onrender.com

  - type: redis
    name: autobot-redis
    plan: starter
    ipAllowList:
      - source: 0.0.0.0/0
        description: all
